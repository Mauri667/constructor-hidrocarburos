<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Constructor de Hidrocarburos</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      margin: 0;
      background: #f9fafc;
      color: #333;
      display: flex;
      height: 100vh;
    }
    /* Panel lateral */
    #sidebar {
      width: 260px;
      background: #2c3e50;
      color: #ecf0f1;
      padding: 20px;
      box-shadow: 2px 0 6px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }
    #sidebar h2 {
      margin-top: 0;
      font-size: 20px;
      border-bottom: 1px solid #34495e;
      padding-bottom: 10px;
    }
    #nombre {
      margin: 15px 0;
      font-size: 16px;
      font-weight: bold;
    }
    #contador {
      margin: 10px 0;
      font-size: 14px;
      background: #34495e;
      padding: 8px;
      border-radius: 5px;
    }
    #botones-ramificacion button {
      margin: 4px 0;
      padding: 6px 12px;
      border: none;
      border-radius: 5px;
      background: #e67e22;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
    }
    #botones-ramificacion button:hover {
      background: #d35400;
    }
    .botones button {
      margin: 5px 0;
      padding: 8px 14px;
      border: none;
      border-radius: 5px;
      background: #2ecc71;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
    }
    .botones button:hover {
      background: #27ae60;
    }
    /* Área principal */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px;
    }
    h1 {
      color: #2c3e50;
      margin-bottom: 20px;
    }
    #canvas {
      position: relative;
      width: 700px;
      height: 450px;
      border: 2px solid #2c3e50;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .carbono {
      width: 45px;
      height: 45px;
      background: #3498db;
      color: #fff;
      border-radius: 50%;
      text-align: center;
      line-height: 45px;
      font-weight: bold;
      position: absolute;
      cursor: grab;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      transition: transform 0.2s;
    }
    .carbono:hover {
      transform: scale(1.1);
      background: #2980b9;
    }
  </style>
</head>
<body>
  <!-- Panel lateral -->
  <div id="sidebar">
    <h2>Información</h2>
    <div id="nombre">---</div>
    <div id="contador">Carbonos: 0 | Hidrógenos: 0</div>
    <div class="botones">
      <button onclick="agregarCarbono()">Agregar carbono</button>
      <button onclick="reiniciar()">Reiniciar fórmula</button>
    </div>
    <div id="botones-ramificacion"></div>
  </div>

  <!-- Área principal -->
  <div id="main">
    <h1>Constructor de Hidrocarburos</h1>
    <canvas id="canvas" width="700" height="450"></canvas>
  </div>

  <!-- Script -->
  <script src="script.js"></script>
</body>
</html>
